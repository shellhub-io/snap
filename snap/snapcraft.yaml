name: shellhub
summary: Access infrastructure for connected devices
description: |
  The ShellHub agent connects the device outbound to a ShellHub server, so the
  device can be reached from anywhere without a public address. Enroll it with
  an install key, by pairing it from the console, or with a tenant ID, and
  access it through the server from the console or any SSH client.
adopt-info: shellhub
grade: stable
base: core22
confinement: classic

architectures:
  - build-on: [amd64]
    build-for: [amd64]
  - build-on: [amd64, arm64]
    build-for: [arm64]
  - build-on: [amd64, armhf]
    build-for: [armhf]

apps:
  shellhub:
    command: bin/shellhub.wrapper
    daemon: simple
    restart-condition: always
    stop-mode: sigterm
  agent:
    command: bin/shellhub.wrapper
    aliases:
      - shellhub-agent

parts:
  shellhub:
    plugin: go
    build-snaps:
      - go/latest/stable
    source: https://github.com/shellhub-io/shellhub.git
    source-tag: v0.25.1
    build-attributes:
      - enable-patchelf
    override-pull: |
      craftctl default
      tag=$(git describe --tags --abbrev=0)
      count=$(git rev-list $tag.. --count)
      if [ "$count" = 0 ];
      then
        version=$tag
      else
        hash=$(git rev-parse --short HEAD)
        version=$tag+git$count.$hash
      fi
      craftctl set version=$version
    override-build: |
      GOARCH=$CRAFT_ARCH_BUILD_FOR
      if [ "$CRAFT_ARCH_BUILD_FOR" = "armhf" ];
      then
        GOARCH=arm
      fi
      export GOARCH
      export CGO_ENABLED=0
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cd agent
      go build -ldflags "-X main.AgentVersion=$(craftctl get version)" -o $SNAPCRAFT_PART_INSTALL/bin/shellhub
  local-bin:
    plugin: dump
    source: snap/local/bin
    organize:
      '*': bin/
